name: olist-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./sql:/sql

  spark:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: spark
    environment:
      SQL_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./scripts:/home/jovyan/scripts
      - ./data:/home/jovyan/data
      - ./lake:/home/jovyan/lake

  airflow:
    build: ./airflow
    container_name: airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_OLIST_SOURCE: '{"conn_type": "mssql", "login": "sa", "password": "${SQL_PASSWORD}", "host": "sqlserver", "port": 1433, "schema": "olist_source"}'
    ports:
      - "9090:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./lake:/opt/airflow/lake
    depends_on:
      - sqlserver

volumes:
  sqldata: